name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare gradle.properties for CI
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK and Release App Bundle (AAB)
        run: ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Prepare Files for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SpeedCheck.apk
          cp app/build/outputs/bundle/release/app-release.aab SpeedCheck.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpeedCheck-build-artifacts
          path: |
            SpeedCheck.apk
            SpeedCheck.aab
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "SpeedCheck v1.0.1 (Closed Testing AAB & Direct APK)"
          body: |
            ## 🇬🇭 SpeedCheck v1.0.1 - Closed Testing & Test Build

            This release contains both the **`SpeedCheck.aab`** (Android App Bundle for Google Play Console Closed Testing) and the **`SpeedCheck.apk`** (for direct phone installation).

            ### 📦 Download Files:
            * **`SpeedCheck.aab`**: Upload this file directly to **Google Play Console** under **Testing > Closed testing** (Version 1.0.1, VersionCode 2). Signed with the release upload keystore.
            * **`SpeedCheck.apk`**: Download to install and test directly on any Android phone without going through the Play Store.

            ### 🚀 What's New in v1.0.1:
            * **🗣️ Realistic Voice Assistant**:
              * Automatically connects to Google Speech Services (`com.google.android.tts`) Neural/WaveNet voices.
              * Natural voice ranking (prioritizes high-quality offline models without robotic pitch warping).
              * Audio ducking: Music / podcasts smoothly dim during voice alerts and restore immediately.
              * Added quick shortcut to open Device TTS Settings to install high-definition offline voice packs.
            * **🌓 Dark / Light Mode Switcher**: Added quick one-tap toggle icon in the top right corner of the Settings screen.
            * **📷 Auto-Detect Speed Cameras**:
              * **Borteyman Sports Facility T-Junction** (80 km/h)
              * **N1 Highway near Fiesta Royale Hotel** (80 km/h)
              * **N1 Highway near Baah Junction / Bar Junction** (80 km/h)
              * **Kawukudi (Obasanjo Highway)** (50 km/h)
              * **Kanda Highway** (50 km/h)
            * **🗣️ Spoken Voice Alerts (TTS)**:
              * Camera ahead voice prompt: *"Speed camera zone ahead on [Zone Name]. Speed limit is [X] km/h."*
              * Early warning approaching alert (notifies 5 km/h before target limit).
              * Immediate over-speed alert: *"Slow down. Current speed is above your limit."*
              * Anti-spam alert repeat cooldown (10–30s).
            * **🔋 Silent Background Operation**: Works with the screen locked or in your pocket. Auto-pauses when stationary to conserve battery.
            * **🎛️ Manual or Auto-Detect Modes**: Switch between automatic GPS speed limits or custom manual limits (30, 50, 80, 100, 120 km/h).
            * **📊 Driving Stats**: Live speedometer, maximum speed, average speed, and trip distance.
            * **🔒 Privacy & Policy**: In-app Privacy Policy dialog and zero tracking/ad IDs.

            ### 📲 How to Install the APK Directly:
            1. Download **`SpeedCheck.apk`** on your Android device.
            2. Tap the downloaded file to install (allow "Install from unknown sources" if prompted).
            3. Open **SpeedCheck**, grant Location and Notification permissions, and tap **START MONITORING**!

            ### 🌐 Google Play Console Closed Testing Instructions:
            1. Download **`SpeedCheck.aab`**.
            2. Open Google Play Console > Select **SpeedCheck** > **Closed testing**.
            3. Click **Create new release**, drop **`SpeedCheck.aab`** into App bundles, enter release notes, and rollout!
          files: |
            SpeedCheck.apk
            SpeedCheck.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
