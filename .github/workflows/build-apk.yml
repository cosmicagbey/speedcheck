name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare gradle.properties for CI
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Release App Bundle (AAB only)
        run: ./gradlew bundleRelease --stacktrace

      - name: Prepare AAB for Release
        run: cp app/build/outputs/bundle/release/app-release.aab SpeedCheck.aab

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedCheck-aab
          path: SpeedCheck.aab
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "SpeedCheck v1.0.5 (Google Play Closed Testing AAB)"
          body: |
            ## 🇬🇭 SpeedCheck v1.0.5 - Google Play Release

            This release provides the official **`SpeedCheck.aab`** (Android App Bundle) signed with the release upload keystore for the **Google Play Console Closed Testing** track.

            ### 📦 Download Bundle:
            * **`SpeedCheck.aab`**: Upload this file directly to **Google Play Console** under **Testing > Closed testing** (Version `1.0.5`, Build `6`).

            ### 🚀 What's New in v1.0.5:
            * **🗺️ Dual-Layer Road-Aware Speed Limits & Camera Detection**:
              * Added over 50 registered road and highway segments across Accra, Kumasi, Tema, and national corridors (Tema Motorway @ 100 km/h, N1 Highway @ 80 km/h, urban town corridors @ 50 km/h, school zones @ 30 km/h).
              * Expanded automated camera database to 27 MTTD & crowd-sourced zones across Greater Accra and Ashanti regions.
              * Road name correlation on dashboard radar card and trip evidence logs.
            * **📲 In-App Updates**:
              * Official Google Play In-App Updates integration (`AppUpdateManager`). Users receive, download, and install updates directly within the app without having to manually open the Play Store.
              * Dedicated "In-App Updates" card in the Settings tab with "Check for Updates" and status display.
            * **📳 Sound, Vibrate & Mute Quick Toggle**:
              * Home screen audio icon cycles in order: **Sound ON (🔊) -> Vibrate (📳) -> Mute (🔇) -> Sound ON (🔊)**.
              * For users who prefer vibration, alerts trigger short haptic bursts each second for 4 seconds in place of spoken voice warnings.
            * **🗣️ Reduced & Contextual Voice Speech (No Overlaps)**:
              * Outside camera zones (approaching or exceeding): *"You are about to cross the speed limit, slow down."*
              * Approaching camera zone (safe speed): *"Speed cameras ahead, be careful."*
              * In camera zone & approaching/breaking limit: *"Speed cameras ahead, slow down."*
            * **🛑 Anti-Jitter Speedometer (Stationary & Walking Filter)**:
              * Strict 8.0 km/h deadband filter prevents false speedometer movement when stationary, parked at red lights, or walking.
              * Exponential moving average (EMA) smoothing eliminates needle jitter.
              * Distance and trip calculations only accumulate when actively driving.
            * **🌓 Isolated Light Theme**:
              * Phone's top notification area / status bar is permanently locked to a solid dark bar (`#0F172A`) with crisp white system icons.
              * Light theme is strictly confined to the in-app screens and never bleeds into or washes out the phone's notification bar.
            * **🛡️ DEX Code Optimization & R8 Obfuscation**: Enabled `isMinifyEnabled = true` with comprehensive ProGuard/R8 rules.
            * **📦 Upgraded Fragment Dependency**: Guaranteed `1.8.6` across the dependency graph.

            ### 🌐 Google Play Console Closed Testing Instructions:
            1. Download **`SpeedCheck.aab`** below.
            2. Open Google Play Console > Select **SpeedCheck** > **Testing** > **Closed testing**.
            3. Click **Create new release**, drop **`SpeedCheck.aab`** into App bundles, enter release notes, and rollout!
          files: SpeedCheck.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
