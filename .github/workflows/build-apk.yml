name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build and publish (for example, v1.0.8)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test Android and web code
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Check PWA JavaScript
        run: |
          node --check docs/speed-estimator.js
          node --check docs/app.js
          node --check docs/sw.js

      - name: Test PWA speed estimator
        run: node --test docs/speed-estimator.test.cjs

  release:
    name: Build and publish signed release AAB
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Configure ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD repository secrets before publishing a release." >&2
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore/upload-keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release App Bundle (AAB only)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-configuration-cache --stacktrace

      - name: Prepare AAB for Release
        run: cp app/build/outputs/bundle/release/app-release.aab SpeedCheck.aab

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedCheck-aab
          path: SpeedCheck.aab
          retention-days: 14

      - name: Create GitHub Release from version tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: "SpeedCheck ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref_name }}"
          body: |
            ## SpeedCheck ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref_name }}

            This release provides the signed **`SpeedCheck.aab`** Android App Bundle for Google Play.

            Upload the bundle to the desired Google Play testing or production track.
          files: SpeedCheck.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
