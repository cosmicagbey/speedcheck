name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare gradle.properties for CI
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Release App Bundle (AAB only)
        run: ./gradlew bundleRelease --stacktrace

      - name: Prepare AAB for Release
        run: cp app/build/outputs/bundle/release/app-release.aab SpeedCheck.aab

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedCheck-aab
          path: SpeedCheck.aab
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "SpeedCheck v1.0.6 (Google Play Closed Testing AAB)"
          body: |
            ## 🇬🇭 SpeedCheck v1.0.6 - Google Play Release

            This release provides the official **`SpeedCheck.aab`** (Android App Bundle) signed with the release upload keystore for the **Google Play Console Closed Testing** track.

            ### 📦 Download Bundle:
            * **`SpeedCheck.aab`**: Upload this file directly to **Google Play Console** under **Testing > Closed testing** (Version `1.0.6`, Build `7`).

            ### 🚀 What's New in v1.0.6:
            * **🏎️ Modern Electric-Cockpit Speedometer**: Dynamic multi-color gradient sweeps, soft ambient radial glow, bold aerodynamic typography, and authentic Ghanaian circular speed limit road sign badge.
            * **🇺🇸 US Import Vehicle Mode (Dual MPH Readout)**: Optional secondary MPH display under KM/H for American-spec dashboard clusters (60 MPH ≈ 97 KM/H) to avoid confusion.
            * **⚡ Speedometer Accuracy & Calibration Advisory**: Educational guide explaining the effect of Abossey Okai tyre swaps, wheel sensor vs GPS Doppler ground speed, and Traffitech automated enforcement.
            * **🛡️ Potential Police Speed Camera Ahead Alerts**: Integrated mobile speedcam patrol locations (28 camera zones) with early cautious warnings.
            * **🗂️ Clean Settings & Alert History**: Collapsed camera list with dropdown toggle; history strictly records warning buffer approaches and speed limit violations.
            * **🛑 Anti-Jitter Speedometer (Stationary & Walking Filter)**:
              * Strict 8.0 km/h deadband filter prevents false speedometer movement when stationary, parked at red lights, or walking.
              * Exponential moving average (EMA) smoothing eliminates needle jitter.
              * Distance and trip calculations only accumulate when actively driving.
            * **🌓 Isolated Light Theme**:
              * Phone's top notification area / status bar is permanently locked to a solid dark bar (`#0F172A`) with crisp white system icons.
              * Light theme is strictly confined to the in-app screens and never bleeds into or washes out the phone's notification bar.
            * **🛡️ DEX Code Optimization & R8 Obfuscation**: Enabled `isMinifyEnabled = true` with comprehensive ProGuard/R8 rules.
            * **📦 Upgraded Fragment Dependency**: Guaranteed `1.8.6` across the dependency graph.

            ### 🌐 Google Play Console Closed Testing Instructions:
            1. Download **`SpeedCheck.aab`** below.
            2. Open Google Play Console > Select **SpeedCheck** > **Testing** > **Closed testing**.
            3. Click **Create new release**, drop **`SpeedCheck.aab`** into App bundles, enter release notes, and rollout!
          files: SpeedCheck.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
