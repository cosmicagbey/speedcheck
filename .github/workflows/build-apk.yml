name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare gradle.properties for CI
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Release App Bundle (AAB only)
        run: ./gradlew bundleRelease --stacktrace

      - name: Prepare AAB for Release
        run: cp app/build/outputs/bundle/release/app-release.aab SpeedCheck.aab

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedCheck-aab
          path: SpeedCheck.aab
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "SpeedCheck v1.0.3 (Google Play Closed Testing AAB)"
          body: |
            ## 🇬🇭 SpeedCheck v1.0.3 - Google Play Release

            This release provides the official **`SpeedCheck.aab`** (Android App Bundle) signed with the release upload keystore for the **Google Play Console Closed Testing** track.

            ### 📦 Download Bundle:
            * **`SpeedCheck.aab`**: Upload this file directly to **Google Play Console** under **Testing > Closed testing** (Version `1.0.3`, Build `4`).

            ### 🚀 What's New in v1.0.3:
            * **🗣️ Short & Precise Voice Speech**:
              * Approaching limit: *"You are about to cross the speed limit."*
              * Over limit: *"Slow down. Speed limit exceeded."*
              * Speed camera ahead: *"Speed cameras ahead."*
            * **🌓 Isolated Light Theme**:
              * Phone's top notification area / status bar is permanently locked to a solid dark bar (`#0F172A`) with crisp white system icons.
              * Light theme is strictly confined to the in-app screens and never bleeds into or washes out the phone's notification bar.
            * **🛡️ DEX Code Optimization & R8 Obfuscation**: Enabled `isMinifyEnabled = true` with comprehensive ProGuard/R8 rules.
            * **📦 Upgraded Fragment Dependency**: Guaranteed `1.8.6` across the dependency graph.
              * **N1 Highway near Baah Junction / Bar Junction** (80 km/h)
              * **Kawukudi (Obasanjo Highway)** (50 km/h)
              * **Kanda Highway** (50 km/h)
            * **🗣️ Spoken Voice Alerts (TTS)**:
              * Camera ahead voice prompt: *"Speed camera ahead on [Zone Name]. Limit is [X] kilometers per hour."*
              * Early warning approaching alert: *"Approaching [X] kilometers per hour."*
              * Immediate over-speed alert: *"Caution. Speed is over your limit of [X] kilometers per hour. Please slow down."*
            * **🔋 Silent Background Operation**: Works with the screen locked or in your pocket. Auto-pauses when stationary to conserve battery.
            * **🔒 Privacy & Policy**: In-app Privacy Policy dialog and zero tracking/ad IDs.

            ### 🌐 Google Play Console Closed Testing Instructions:
            1. Download **`SpeedCheck.aab`** below.
            2. Open Google Play Console > Select **SpeedCheck** > **Testing** > **Closed testing**.
            3. Click **Create new release**, drop **`SpeedCheck.aab`** into App bundles, enter release notes, and rollout!
          files: SpeedCheck.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
